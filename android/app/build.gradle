plugins {
    id 'com.android.application'
}

android {
    namespace 'io.suiting.music'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'io.suiting.music.publicapp'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '0.1.4-public'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        debug {
            storeFile file(System.getenv('SUITING_DEBUG_KEYSTORE') ?: rootProject.file('local-debug.keystore'))
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    sourceSets.main.assets.srcDirs = [layout.buildDirectory.dir('generated/assets')]
}

tasks.register('prepareWebAssets', Exec) {
    workingDir rootProject.projectDir.parentFile
    commandLine 'node', 'scripts/prepare-android.mjs'
}
tasks.named('preBuild').configure { dependsOn 'prepareWebAssets' }

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-session:1.5.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.vaadin.external.google:android-json:0.0.20131108.vaadin1'
}
